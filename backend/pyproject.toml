[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-metrics-api"
version = "0.1.0"
description = "Financial Metrics Dashboard — FastAPI backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "debugpy",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true